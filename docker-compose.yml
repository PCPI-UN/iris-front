services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
        NEXT_PUBLIC_ENABLE_API_MOCKING: ${NEXT_PUBLIC_ENABLE_API_MOCKING}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    
    container_name: iris-frontend
    
    ports:
      - "${PORT}:${PORT}"
    
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      API_URL: ${API_URL}
      NEXT_PUBLIC_ENABLE_API_MOCKING: ${NEXT_PUBLIC_ENABLE_API_MOCKING}
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + process.env.PORT, (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  iris-network:
    driver: bridge
